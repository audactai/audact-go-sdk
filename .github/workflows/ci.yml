name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          go test -race -count=1 -v ./... > "$RUNNER_TEMP/t.log" 2>&1 || { cat "$RUNNER_TEMP/t.log"; exit 1; }
      - name: Fail on skipped tests
        run: |
          if [ "$(grep -c -- '--- SKIP' "$RUNNER_TEMP/t.log" || true)" -gt 0 ]; then
            grep -- '--- SKIP' "$RUNNER_TEMP/t.log"
            echo "skipped tests are not allowed"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25.0'
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.11.4
